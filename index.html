<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logger sensor readings</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1050px; margin: 0 auto; padding: 24px; background: Canvas; color: CanvasText; }
    h1 { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; margin-top: 0; font-size: 1.45rem; }
    #measurement-info { margin-left: auto; font-size: .9rem; font-weight: normal; text-align: right; }
    .status { padding: 12px 14px; border-radius: 8px; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    .error { background: #ffe5e5; color: #7c1111; }
    #o2-card.error { background: none; color: #800020; }
    #o2-card strong, #o2-card p { display: inline; margin: 0 .5rem 0 0; font-size: 1.05rem; font-weight: bold; line-height: normal; opacity: 1; }
    .values { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; margin: 20px 0; }
    .card { padding: 16px; border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 10px; }
    .card small { display: block; opacity: .7; }
    .card strong { display: block; margin-top: 3px; font-size: 1.05rem; }
    .card p { font-size: .9rem; line-height: 1.5; opacity: .75; }
    #environment-card { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.5rem; min-width: 0; }
    #o2-card { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    #co2-card::before, #o2-card::before { content: "•"; font-size: 2em; line-height: 1; }
    #co2-card::before { color: #fff; }
    #o2-card::before { margin-right: .6rem; color: #38bdf8; }
    .reading { display: flex; align-items: center; gap: .6rem; white-space: nowrap; }
    .reading strong { margin-top: 0; }
    .reading svg { width: 1.25rem; height: 1.25rem; flex: none; }
    #pressure-reading svg { color: #22c55e; }
    .reading svg[aria-label="Temperature"] { color: #ef4444; }
    .reading svg[aria-label="Humidity"] { color: #3b82f6; }
    #lux-reading svg { color: #facc15; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    #chart { width: 100%; height: auto; min-height: 360px; display: block; border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 10px; background: color-mix(in srgb, CanvasText 3%, Canvas); }
    svg[hidden] { display: none; }
    @media (max-width: 560px) {
      body { padding: 14px; }
    }
  </style>
</head>
<body>
  <h1><span>Sensor: <span id="sensor-id">—</span></span><span id="measurement-info" hidden>last reading #<span id="measurement">—</span> at <span id="timestamp">—</span></span></h1>
  <div id="status" class="status" hidden></div>

  <section id="values" class="values" aria-label="Latest readings" hidden>
    <div id="environment-card" class="card" aria-label="Pressure, temperature, humidity, tilt, illuminance, O₂ and CO₂">
      <div id="pressure-reading" class="reading" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Pressure"><circle cx="12" cy="12" r="9"/><path d="M12 5v2M5 12h2M17 12h2M12 12l4-4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
        <strong id="pressure">—</strong>
      </div>
      <div class="reading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Temperature"><path d="M9 14.8V5a3 3 0 0 1 6 0v9.8a5 5 0 1 1-6 0Z"/><path d="M12 8v10"/><circle cx="12" cy="18" r="2" fill="currentColor"/></svg>
        <strong id="temp">—</strong>
      </div>
      <div class="reading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Humidity"><path d="M12 3C10 7 5 11 5 15a7 7 0 0 0 14 0c0-4-5-8-7-12Z"/><path d="M9 16a3 3 0 0 0 3 3"/></svg>
        <strong id="humidity">—</strong>
      </div>
      <div id="tilt-card" class="reading" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Tilt angle"><path d="M20 20H4L15 4M10 20a6 6 0 0 0-2.6-5"/></svg>
        <strong id="tilt">—</strong>
      </div>
      <div id="lux-reading" class="reading" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Illuminance"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <strong id="lux">—</strong>
      </div>
      <div id="co2-card" class="reading" hidden><strong id="co2">—</strong></div>
      <div id="o2-card"><strong id="o2">—</strong><p id="o2-details" hidden></p></div>
    </div>
  </section>
  <section id="message-card" class="card" aria-label="Additional text" hidden>
    <small>Additional text</small>
    <p id="message" class="message"></p>
  </section>

  <!-- Chart display is temporarily disabled. -->
  <svg id="chart" viewBox="0 0 1000 440" role="img" aria-label="Readings chart" hidden></svg>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const hex = (value, width = 2) => `0x${value.toString(16).toUpperCase().padStart(width, '0')}`;

      function decodeBase64(fragment) {
        // Regular Base64, URL-safe Base64, and whitespace are supported.
        let value = decodeURIComponent(fragment).replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
        value += '='.repeat((4 - value.length % 4) % 4);
        const binary = atob(value);
        return Uint8Array.from(binary, char => char.charCodeAt(0));
      }

      function parse(bytes) {
        // LOGGER_RECORD_FORMAT.md: 21-byte header + 21-byte measurement, little-endian.
        if (bytes.length !== 42) throw new Error('Expected a 42-byte logger record (56 Base64 characters).');
        if (bytes.subarray(4, 21).some(byte => byte !== 0)) throw new Error('Device header reserved bytes must be zero.');
        const header = new DataView(bytes.buffer, bytes.byteOffset, 21);
        const view = new DataView(bytes.buffer, bytes.byteOffset + 21, 21);
        const mask = view.getUint8(4);
        const o2Status = view.getUint8(16);
        return {
          deviceId: header.getUint32(0, true),
          measurement: view.getUint16(0, true),
          humidity: view.getUint8(2) * 0.5,
          timestamp: view.getUint32(17, true),
          mask,
          lux: mask & 0x01 ? view.getUint16(5, true) * 10 : null,
          x: mask & 0x02 ? view.getInt8(7) * 10 : null,
          y: mask & 0x02 ? view.getInt8(8) * 10 : null,
          z: mask & 0x02 ? view.getInt8(9) * 10 : null,
          pressure: mask & 0x04 ? view.getUint8(10) * 500 : null,
          temp: view.getInt8(11),
          co2: mask & 0x08 ? view.getInt16(12, true) / 100 : null,
          o2: o2Status === 0 ? view.getInt16(14, true) / 100 : null,
          o2Status,
        };
      }

      function readFragment(fragment) {
        // The 42-byte record occupies 56 Base64 characters, without padding.
        // Count decoded characters so percent escapes and Base64 whitespace still work.
        let end = 0, count = 0;
        while (end < fragment.length && count < 56) {
          const token = fragment[end] === '%' ? fragment.slice(end, end + 3) : fragment[end];
          const char = decodeURIComponent(token);
          if (!/\s/.test(char)) {
            if (!/^[A-Za-z0-9+/_-]$/.test(char)) throw new Error('Invalid Base64 logger record.');
            count++;
          }
          end += token.length;
        }
        const data = parse(decodeBase64(fragment.slice(0, end)));
        const suffix = fragment.slice(end);
        let text;
        try {
          // A literal % in the appended text need not be a URL escape.
          text = decodeURIComponent(suffix.replace(/%(?![0-9a-f]{2})/gi, '%25'));
        } catch {
          text = suffix;
        }
        return { data, text };
      }

      try {
        const fragment = location.hash.slice(1);
        if (!fragment) return;
        const { data, text } = readFragment(fragment);
        $('sensor-id').textContent = String(data.deviceId).padStart(4, '0');
        $('measurement').textContent = String(data.measurement);
        $('timestamp').textContent = `${data.timestamp} s`;
        $('measurement-info').hidden = false;
        $('humidity').textContent = `${data.humidity.toFixed(1)} %RH`;
        $('co2-card').hidden = data.co2 === null;
        $('lux-reading').hidden = data.lux === null;
        $('lux').textContent = data.lux === null ? '—' : `${data.lux} lux`;
        $('tilt-card').hidden = data.x === null;
        const angle = data.x === null || Math.hypot(data.x, data.y, data.z) === 0
          ? null : Math.atan2(Math.hypot(data.x, data.y), data.z) * 180 / Math.PI;
        $('tilt').textContent = angle === null ? '—' : `${Number(angle.toFixed(1))}°`;
        $('pressure-reading').hidden = data.pressure === null;
        $('temp').textContent = `${data.temp} °C`;
        $('pressure').textContent = data.pressure === null ? '—' : `${data.pressure / 100} hPa`;
        $('co2').textContent = data.co2 === null ? '—' : `${data.co2.toFixed(2)} % CO₂`;
        const o2Flags = [
          [0x01, 'Measurement complete'],
          [0x02, 'Measurement in progress'],
          [0x04, 'SHT4x error'],
          [0x10, 'SHT4x measurement complete'],
          [0x20, 'Default script restored'],
        ];
        if (data.o2Status === 0) {
          $('o2').textContent = `${data.o2.toFixed(2)} %`;
        } else {
          $('o2').textContent = 'O2 Measurement failed';
          $('o2-card').classList.add('error');
          const flags = o2Flags.filter(([bit]) => data.o2Status & bit).map(([, label]) => label);
          $('o2-details').textContent = `(${hex(data.o2Status)}${flags.length ? ': ' + flags.join('; ') : ''})`;
          $('o2-details').hidden = false;
        }
        $('values').hidden = false;
        $('message').textContent = text;
        $('message-card').hidden = text.length === 0;
      } catch (error) {
        $('status').classList.add('error');
        $('status').hidden = false;
        $('status').textContent = `Could not read data: ${error.message}`;
      }
    })();
  </script>
</body>
</html>

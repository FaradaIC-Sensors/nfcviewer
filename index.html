<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logger sensor readings</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; scrollbar-gutter: stable; }
    body { max-width: 1050px; margin: 0 auto; padding: 4px 24px 24px; background: Canvas; color: CanvasText; }
    .app-header { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: .5rem 1rem; margin-bottom: 4px; }
    .app-header h1 { grid-column: 1; grid-row: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    h1 { margin: 0; font-size: 1.45rem; }
    #measurement-info { margin: 0; font-size: .9rem; font-weight: normal; text-align: left; }
    .navigation { grid-column: 3; grid-row: 1; justify-self: end; display: flex; justify-content: flex-end; flex-wrap: nowrap; gap: 6px; }
    .navigation a { display: inline-flex; align-items: center; justify-content: center; padding: 9px 10px; border-radius: 8px; color: inherit; text-decoration: none; }
    .navigation a svg { width: 20px; height: 20px; }
    .navigation a:hover { background: color-mix(in srgb, CanvasText 8%, Canvas); }
    .navigation a[aria-current="page"] { background: color-mix(in srgb, CanvasText 14%, Canvas); font-weight: 600; }
    .navigation a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    #page-content:focus { outline: none; }
    body:has(#measurements-page:not([hidden])) { box-sizing: border-box; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    body:has(#measurements-page:not([hidden])) .app-header { flex: none; }
    body:has(#measurements-page:not([hidden])) #page-content { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #measurements-page, #history { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #history-summary { flex: none; }
    #history-values { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; align-content: start; margin-bottom: 0; }
    .status { padding: 12px 14px; border-radius: 8px; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    .error { background: #ffe5e5; color: #7c1111; }
    .o2-reading.error { background: none; color: #800020; }
    .record .o2-reading strong, .record .o2-reading p { display: inline; margin: 0 .5rem 0 0; font-size: 1.05rem; font-weight: bold; line-height: normal; opacity: 1; }
    .values { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 4px 0 20px; }
    .card { padding: 16px; border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 10px; }
    #latest-page .card { border: none; padding-left: 20%; }
    .card small { display: block; opacity: .7; }
    .card strong { display: block; margin-top: 3px; font-size: 1.05rem; }
    .card p { font-size: .9rem; line-height: 1.5; opacity: .75; }
    .record-values { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.5rem; min-width: 0; }
    #latest-page .record-values { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.125rem; font-size: 2rem; }
    #latest-page .record-values > div { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); align-items: center; gap: .6rem; min-height: 2.5rem; white-space: normal; }
    #latest-page .record-values strong, #latest-page .record-values p { display: block; margin: 0; font-size: 2.1rem; line-height: 1.2; }
    #latest-page .reading svg { width: 2.5rem; height: 2.5rem; }
    #latest-page .co2-reading::before, #latest-page .o2-reading::before { content: ""; width: 1rem; height: 1rem; border-radius: 50%; background: currentColor; justify-self: center; }
    .o2-reading { display: flex; align-items: center; gap: .6rem; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .o2-text { min-width: 0; }
    .co2-reading::before, .o2-reading::before { content: "•"; font-size: 2em; line-height: 1; }
    .co2-reading::before { color: #fff; }
    .o2-reading::before { flex: none; color: #38bdf8; }
    .reading { display: flex; align-items: center; gap: .6rem; white-space: nowrap; }
    .reading strong { margin-top: 0; }
    .reading svg { width: 1.25rem; height: 1.25rem; flex: none; }
    .pressure-reading svg { color: #22c55e; }
    .reading svg[aria-label="Temperature"] { color: #ef4444; }
    .reading svg[aria-label="Humidity"] { color: #3b82f6; }
    .lux-reading svg { color: #facc15; }
    .record-heading { margin-bottom: .75rem; font-size: .9rem; opacity: .75; }
    #history-summary { margin: 0; font-size: .9rem; opacity: .75; }
    [hidden] { display: none !important; }
    #chart-panel { margin-bottom: 20px; overflow: hidden; }
    .chart-legend { grid-column: 2; grid-row: 1; z-index: 1; display: flex; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; line-height: 16px; white-space: nowrap; }
    .chart-legend-item { display: inline-flex; align-items: center; gap: 4px; font: inherit; color: var(--series-color); }
    .chart-legend-item[aria-pressed="false"] { color: #808080; }
    .chart-legend-item:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .chart-swatch { width: 10px; border-top: 2px solid currentColor; }
    .chart-swatch.dashed { border-top-style: dashed; }
    .chart-layout { display: grid; grid-template-columns: auto minmax(96px, 1fr) auto; align-items: start; min-width: 0; }
    .chart-axes { grid-column: 1; grid-row: 1; display: block; width: var(--axis-width); min-width: 0; }
    .chart-axes:last-child { grid-column: 3; }
    .chart-scroll { grid-column: 2; grid-row: 1; min-width: 96px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x pan-y; }
    .chart-section:not(:last-of-type) .chart-scroll { scrollbar-width: none; }
    .chart-section:not(:last-of-type) .chart-scroll::-webkit-scrollbar { display: none; }
    .chart-plot { display: block; }
    .chart-grid { stroke: CanvasText; stroke-opacity: .15; }
    .chart-label { fill: CanvasText; }
    .chart-zoom-slot { grid-column: 2; grid-row: 1; width: 100px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
    .chart-zoom { display: flex; justify-content: center; gap: .5rem; }
    .chart-zoom button { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; padding: 4px 10px; border: 1px solid color-mix(in srgb, CanvasText 35%, Canvas); border-radius: 5px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .chart-zoom button svg { width: 24px; height: 24px; }
    .chart-zoom button:disabled { opacity: .35; cursor: default; }
    @media (max-width: 760px) {
      .app-header { column-gap: .5rem; }
      .app-header h1 { font-size: 1.05rem; }
    }
    @media (max-width: 560px) {
      body { padding: 4px 14px 14px; }
      .app-header { column-gap: 4px; }
      .app-header h1 { font-size: 1rem; }
      .chart-zoom-slot { width: 64px; min-height: 32px; }
      .chart-zoom { gap: 4px; }
      .chart-zoom button { box-sizing: border-box; width: 30px; min-width: 0; min-height: 32px; padding: 4px; }
      .chart-zoom button svg { width: 20px; height: 20px; }
      .navigation { gap: 2px; }
      .navigation a { padding: 6px 4px; }
      #chart-panel { margin-left: -14px; margin-right: -14px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 id="sensor-heading">Sensor: <span id="sensor-id">—</span></h1>
    <div class="chart-zoom-slot">
      <div id="chart-zoom" class="chart-zoom" role="group" aria-label="Time zoom" hidden>
        <button id="chart-zoom-in" type="button" aria-label="Zoom in time" title="Zoom in time" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5M7 10.5h7M10.5 7v7"/></svg>
        </button>
        <button id="chart-zoom-out" type="button" aria-label="Zoom out time" title="Zoom out time" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5M7 10.5h7"/></svg>
        </button>
      </div>
    </div>
    <nav class="navigation" aria-label="Main navigation">
      <a id="nav-latest" href="?" aria-current="page" aria-label="Latest" title="Latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a id="nav-charts" href="?page=charts" aria-label="Charts" title="Charts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18M6 15l5-6 4 3 6-8"/></svg>
      </a>
      <a id="nav-measurements" href="?page=measurements" aria-label="Measurements" title="Measurements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/><path d="M9 6h12M9 12h12M9 18h12"/></svg>
      </a>
    </nav>
  </header>
  <main id="page-content" tabindex="-1">
    <div id="status" class="status" role="status" hidden></div>
    <section id="latest-page" aria-labelledby="nav-latest">
      <p id="measurement-info" hidden>last reading #<span id="measurement">—</span> at <span id="timestamp">—</span></p>
      <section id="values" class="values" aria-label="Latest reading" hidden></section>
    </section>
    <section id="charts-page" aria-labelledby="nav-charts" hidden>
  <section id="chart-panel" aria-label="Measurement history chart" hidden>
    <section class="chart-section" aria-label="O₂, CO₂ and Temperature">
      <div class="chart-layout">
        <div id="chart-legend" class="chart-legend" aria-label="Chart legend"></div>
        <svg id="chart-left-axes" class="chart-axes" preserveAspectRatio="none" role="img" aria-label="O₂ and CO₂, %"></svg>
        <div id="chart-scroll" class="chart-scroll" tabindex="0" role="region" aria-label="Scrollable O₂, CO₂ and Temperature history">
          <svg id="chart" class="chart-plot" preserveAspectRatio="none" role="img" aria-label="O₂, CO₂ and Temperature history"></svg>
        </div>
        <svg id="chart-right-axes" class="chart-axes" preserveAspectRatio="none" role="img" aria-label="Temperature, °C"></svg>
      </div>
    </section>
    <section class="chart-section" aria-label="Pressure and RH">
      <div class="chart-layout">
        <div id="chart-legend-2" class="chart-legend" aria-label="Chart legend"></div>
        <svg id="chart-left-axes-2" class="chart-axes" preserveAspectRatio="none" role="img" aria-label="Pressure, hPa"></svg>
        <div id="chart-scroll-2" class="chart-scroll" tabindex="0" role="region" aria-label="Scrollable Pressure and RH history">
          <svg id="chart-2" class="chart-plot" preserveAspectRatio="none" role="img" aria-label="Pressure and RH history"></svg>
        </div>
        <svg id="chart-right-axes-2" class="chart-axes" preserveAspectRatio="none" role="img" aria-label="Humidity, %RH"></svg>
      </div>
    </section>
    <section class="chart-section" aria-label="Illuminance and Tilt">
      <div class="chart-layout">
        <div id="chart-legend-3" class="chart-legend" aria-label="Chart legend"></div>
        <svg id="chart-left-axes-3" class="chart-axes" preserveAspectRatio="none" role="img" aria-label="Illuminance, lux"></svg>
        <div id="chart-scroll-3" class="chart-scroll" tabindex="0" role="region" aria-label="Scrollable Illuminance and Tilt history">
          <svg id="chart-3" class="chart-plot" preserveAspectRatio="none" role="img" aria-label="Illuminance and Tilt history"></svg>
        </div>
        <svg id="chart-right-axes-3" class="chart-axes" preserveAspectRatio="none" role="img" aria-label="Tilt, degrees"></svg>
      </div>
    </section>
  </section>
    </section>
    <section id="measurements-page" aria-labelledby="nav-measurements" hidden>
      <section id="history" aria-label="Measurements" hidden>
        <p id="history-summary"></p>
        <section id="history-values" class="values" aria-label="All readings" tabindex="0"></section>
      </section>
    </section>
  </main>
  <template id="reading-template">
    <article class="card record">
      <div class="record-heading" data-field="record-heading">reading #<span data-field="measurement"></span> at <span data-field="timestamp"></span></div>
      <div data-field="environment-card" class="record-values" aria-label="Pressure, temperature, humidity, tilt, illuminance, O₂ and CO₂">
        <div data-field="pressure-reading" class="reading pressure-reading" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Pressure"><circle cx="12" cy="12" r="9"/><path d="M12 5v2M5 12h2M17 12h2M12 12l4-4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
          <strong data-field="pressure">—</strong>
        </div>
        <div class="reading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Temperature"><path d="M9 14.8V5a3 3 0 0 1 6 0v9.8a5 5 0 1 1-6 0Z"/><path d="M12 8v10"/><circle cx="12" cy="18" r="2" fill="currentColor"/></svg>
          <strong data-field="temp">—</strong>
        </div>
        <div class="reading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Humidity"><path d="M12 3C10 7 5 11 5 15a7 7 0 0 0 14 0c0-4-5-8-7-12Z"/><path d="M9 16a3 3 0 0 0 3 3"/></svg>
          <strong data-field="humidity">—</strong>
        </div>
        <div data-field="tilt-card" class="reading" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Tilt angle"><path d="M20 20H4L15 4M10 20a6 6 0 0 0-2.6-5"/></svg>
          <strong data-field="tilt">—</strong>
        </div>
        <div data-field="lux-reading" class="reading lux-reading" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Illuminance"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <strong data-field="lux">—</strong>
        </div>
        <div data-field="co2-card" class="reading co2-reading" hidden><strong data-field="co2">—</strong></div>
        <div data-field="o2-card" class="o2-reading"><div class="o2-text"><strong data-field="o2">—</strong><p data-field="o2-details" hidden></p></div></div>
      </div>
    </article>
  </template>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const hex = (value, width = 2) => `0x${value.toString(16).toUpperCase().padStart(width, '0')}`;
      const pages = { latest: 'Latest reading', charts: 'Charts', measurements: 'Measurements' };
      let resizeCharts = () => {};

      function showPage(focus = false) {
        const requested = new URLSearchParams(location.search).get('page');
        const page = Object.hasOwn(pages, requested) ? requested : 'latest';
        for (const key of Object.keys(pages)) {
          $(`${key}-page`).hidden = key !== page;
          const link = $(`nav-${key}`);
          if (key === page) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
          const url = new URL(location.href);
          url.searchParams.delete('page');
          if (key !== 'latest') url.searchParams.set('page', key);
          link.href = url.href;
        }
        $('chart-zoom').hidden = page !== 'charts';
        document.title = `${pages[page]} · Logger sensor readings`;
        if (page === 'charts') resizeCharts();
        if (focus) {
          $('page-content').focus({ preventScroll: true });
          window.scrollTo(0, 0);
        }
      }

      for (const key of Object.keys(pages)) {
        $(`nav-${key}`).addEventListener('click', event => {
          if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          const href = $(`nav-${key}`).href;
          if (href === location.href) return;
          window.history.pushState(null, '', href);
          showPage(true);
        });
      }
      window.addEventListener('popstate', () => showPage(true));
      showPage();

      function decodeBase64(fragment) {
        // Regular Base64, URL-safe Base64, and whitespace are supported.
        let value = decodeURIComponent(fragment).replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
        if (value.length < 56 || value.length % 28 !== 0 || !/^[A-Za-z0-9+/]+$/.test(value)) throw new Error('Expected a device header and complete Base64 packet blocks (28 characters per block).');
        const binary = atob(value);
        return Uint8Array.from(binary, char => char.charCodeAt(0));
      }

      function parse(bytes) {
        // One 21-byte device header followed by one or more complete packet slots.
        if (bytes.length < 42 || bytes.length % 21 !== 0) throw new Error('Expected a 21-byte device header followed by complete 21-byte measurement packets.');
        if (bytes.subarray(4, 21).some(byte => byte !== 0)) throw new Error('Device header reserved bytes must be zero.');
        const header = new DataView(bytes.buffer, bytes.byteOffset, 21);
        const records = [];
        for (let offset = 21; offset < bytes.length; offset += 21) {
          const packet = bytes.subarray(offset, offset + 21);
          // An empty slot does not terminate the list; number 0 alone is valid.
          if (packet.every(byte => byte === 0)) continue;
          const view = new DataView(packet.buffer, packet.byteOffset, 21);
          const mask = view.getUint8(4);
          const o2Status = view.getUint8(16);
          records.push({
            packetIndex: offset / 21 - 1,
            measurement: view.getUint16(0, true),
            humidity: view.getUint8(2) * 0.5,
            timestamp: view.getUint32(17, true),
            lux: mask & 0x01 ? view.getUint16(5, true) * 10 : null,
            x: mask & 0x02 ? view.getInt8(7) * 10 : null,
            y: mask & 0x02 ? view.getInt8(8) * 10 : null,
            z: mask & 0x02 ? view.getInt8(9) * 10 : null,
            pressure: mask & 0x04 ? view.getUint8(10) * 500 : null,
            temp: view.getInt8(11),
            co2: mask & 0x08 ? view.getInt16(12, true) / 100 : null,
            o2: o2Status === 0 ? view.getInt16(14, true) / 100 : null,
            o2Status,
          });
        }
        return { deviceId: header.getUint32(0, true), records };
      }

      function formatTime(milliseconds) {
        const date = new Date(milliseconds);
        const pad = value => String(value).padStart(2, '0');
        return `${pad(date.getDate())}.${pad(date.getMonth() + 1)} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
      }

      function tiltAngle(data) {
        return data.x === null || Math.hypot(data.x, data.y, data.z) === 0
          ? null : Math.atan2(Math.hypot(data.x, data.y), data.z) * 180 / Math.PI;
      }

      function drawChart(records, timeOffset) {
        const node = (tag, attrs = {}, text = '') => {
          const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
          Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
          el.textContent = text;
          return el;
        };
        const series = [
          { key: 'o2', label: 'O₂', unit: '%', minRange: 2, color: '#38bdf8', value: r => r.o2 },
          { key: 'co2', label: 'CO₂', unit: '%', minRange: 2, color: 'CanvasText', value: r => r.co2 },
          { key: 'temp', label: 'Temperature', unit: '°C', minRange: 5, color: '#ef4444', value: r => r.temp },
          { key: 'pressure', label: 'Pressure', unit: 'hPa', minRange: 300, color: '#22c55e', value: r => r.pressure === null ? null : r.pressure / 100 },
          { key: 'humidity', label: 'RH', unit: '%RH', minRange: 5, color: '#3b82f6', value: r => r.humidity },
          { key: 'lux', label: 'Illuminance', unit: 'lux', minRange: 100, color: '#facc15', value: r => r.lux },
          { key: 'tilt', label: 'Tilt', unit: '°', minRange: 20, color: 'CanvasText', value: tiltAngle },
        ];
        const charts = [
          { suffix: '', axes: [['o2', 'co2'], ['temp']] },
          { suffix: '-2', axes: [['pressure'], ['humidity']] },
          { suffix: '-3', axes: [['lux'], ['tilt']] },
        ].map((chart, index, all) => ({
          ...chart, svg: $(`chart${chart.suffix}`), viewport: $(`chart-scroll${chart.suffix}`),
          // Reserve time-label space only below the bottom chart.
          height: index === all.length - 1 ? 390 : 344,
        }));
        const ordered = [...records].sort((a, b) => a.timestamp - b.timestamp || a.packetIndex - b.packetIndex);
        const curves = series.map(s => ({ ...s, points: ordered.map(record => ({ record, value: s.value(record) })) }))
          .filter(s => s.points.some(p => p.value !== null));
        // Reserve identical axis gutters even when a metric is unavailable, keeping time aligned.
        const axisWidth = 76;
        const plotTop = 24;
        let plotBottom = 338;
        const stepX = 10 * 60 * 1000;
        const startTime = timeOffset + ordered[0].timestamp * 1000;
        const start = new Date(startTime);
        const firstTime = startTime - ((start.getMinutes() % 10) * 60 + start.getSeconds()) * 1000 - start.getMilliseconds();
        const latestTime = timeOffset + ordered.at(-1).timestamp * 1000;
        const intervals = Math.max(2, Math.ceil((latestTime - firstTime) / stepX));
        const lastTime = firstTime + intervals * stepX;
        let W = 720;
        const minZoom = Math.min(1, 2 / intervals), maxZoom = 8;
        let zoom = minZoom;
        const geometryUpdates = [];
        const positionedNode = (tag, attrs, position, text = '') => {
          const el = node(tag, attrs, text);
          const update = () => Object.entries(position()).forEach(([key, value]) => el.setAttribute(key, value));
          geometryUpdates.push(update);
          update();
          return el;
        };
        const timePadding = 32;
        const timeX = time => timePadding + (time - firstTime) / (lastTime - firstTime) * (W - 2 * timePadding);
        const x = timestamp => timeX(timeOffset + timestamp * 1000);
        const ticks = Array.from({ length: intervals + 1 }, (_, i) => firstTime + i * stepX);
        const timeLabels = [];
        charts.forEach(({ suffix, svg, axes, height }) => {
          const legend = $(`chart-legend${suffix}`);
          svg.setAttribute('height', height);
          legend.replaceChildren();
          svg.replaceChildren(
            node('title', {}, 'History of sensor readings'),
            node('desc', {}, `${records.length} measurements. Time zoom and scrolling are synchronized across all three charts. Unavailable readings leave gaps.`),
            positionedNode('rect', { x: 0, y: plotTop, fill: 'none', class: 'chart-grid', 'data-plot-area': '' }, () => ({ width: W, height: plotBottom - plotTop })),
          );
          for (let i = 1; i < 4; i++) {
            svg.append(positionedNode('line', { x1: 0, class: 'chart-grid' }, () => {
              const py = plotTop + (plotBottom - plotTop) * i / 4;
              return { x2: W, y1: py, y2: py };
            }));
          }
          ticks.forEach(time => svg.append(positionedNode('line', { y1: plotTop, class: 'chart-grid' }, () => ({ x1: timeX(time), x2: timeX(time), y2: plotBottom }))));
          axes.forEach((keys, side) => {
            const left = side === 0;
            const container = $(`chart-${left ? 'left' : 'right'}-axes${suffix}`);
            container.setAttribute('viewBox', `0 0 ${axisWidth} ${height}`);
            container.setAttribute('height', height);
            container.setAttribute('style', `--axis-width: ${axisWidth}px`);
            container.replaceChildren(node('title', {}, `${left ? 'Left' : 'Right'} Y scale`));
            const axisCurves = curves.filter(s => keys.includes(s.key));
            if (!axisCurves.length) return;
            // O₂ and CO₂ share one range and one physical axis on the first chart.
            const values = axisCurves.flatMap(s => s.points.filter(p => p.value !== null).map(p => p.value));
            let min = Math.min(...values), max = Math.max(...values);
            const minRange = Math.max(...axisCurves.map(s => s.minRange));
            // Expand around the data midpoint before rounding to readable ticks.
            const pad = Math.max((minRange - (max - min)) / 2,
              min === max ? Math.max(Math.abs(min) * .1, 1) : (max - min) * .08);
            min -= pad;
            max += pad;
            const rawStep = Math.max(1, (max - min) / 4);
            const magnitude = 10 ** Math.floor(Math.log10(rawStep));
            const step = [1, 2, 5, 10].map(factor => factor * magnitude).find(value => value >= rawStep);
            min = Math.floor(min / step) * step;
            max = Math.ceil(max / step) * step;
            const y = value => plotBottom - (value - min) / (max - min) * (plotBottom - plotTop);
            const axisX = left ? axisWidth - 1 : 1;
            const labelX = axisX + (left ? -8 : 8);
            const anchor = left ? 'end' : 'start';
            const color = axisCurves.length > 1 ? 'CanvasText' : axisCurves[0].color;
            const unit = axisCurves[0].unit;
            const axis = node('g', { 'data-axis-series': keys.join(' '), role: 'group', 'aria-label': `${axisCurves.map(s => s.label).join(', ')}, ${unit}` });
            axis.append(
              positionedNode('line', { x1: axisX, x2: axisX, y1: plotTop, stroke: color, 'data-y-axis': keys.join(' ') }, () => ({ y2: plotBottom })),
              node('text', { x: labelX, y: plotTop - 12, fill: color, 'text-anchor': anchor, 'font-size': 11, 'font-weight': 600 }, unit),
            );
            for (let value = min; value <= max; value += step) {
              axis.append(positionedNode('line', { x1: axisX, x2: axisX + (left ? -4 : 4), stroke: color }, () => ({ y1: y(value), y2: y(value) })));
              axis.append(positionedNode('text', { x: labelX, fill: color, 'text-anchor': anchor, 'font-size': 11, 'data-axis-value': value }, () => {
                const stride = Math.max(1, Math.ceil(20 / ((plotBottom - plotTop) * step / (max - min))));
                return { y: y(value) + 4, visibility: ((value - min) / step) % stride === 0 ? 'visible' : 'hidden' };
              }, String(value)));
            }
            container.append(axis);
            axisCurves.forEach(s => {
              const item = document.createElement('span');
              item.setAttribute('class', 'chart-legend-item');
              item.setAttribute('style', `--series-color: ${s.color}`);
              // Series visibility controls are temporarily disabled.
              // Use a button instead of a span and restore this attribute and handler to enable them.
              // item.setAttribute('type', 'button');
              // item.setAttribute('aria-pressed', 'true');
              const swatch = document.createElement('span');
              swatch.setAttribute('class', `chart-swatch${s.dash ? ' dashed' : ''}`);
              swatch.setAttribute('aria-hidden', 'true');
              const label = document.createElement('span');
              label.textContent = s.label;
              item.append(swatch, label);
              legend.append(item);
              const group = node('g', { 'data-series': s.key, role: 'group', 'aria-label': `${s.label}, ${s.unit}` });
              const pathPoints = s.points.map(({ record, value }) => value === null ? null : { timestamp: record.timestamp, value });
              group.append(positionedNode('path', { fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-dasharray': s.dash || 'none' }, () => {
                let connected = false;
                const segments = pathPoints.map(point => {
                  if (!point) { connected = false; return ''; }
                  const command = connected ? 'L' : 'M';
                  connected = true;
                  return `${command}${x(point.timestamp).toFixed(2)},${y(point.value).toFixed(2)}`;
                });
                return { d: segments.filter(Boolean).join(' ') };
              }));
              svg.append(group);
              /*
              item.addEventListener('click', () => {
                const visible = group.getAttribute('visibility') !== 'hidden';
                group.setAttribute('visibility', visible ? 'hidden' : 'visible');
                group.setAttribute('aria-hidden', String(visible));
                item.setAttribute('aria-pressed', String(!visible));
              });
              */
            });
          });
          // Only the bottom chart needs labels for the shared time axis.
          if (svg !== charts.at(-1).svg) return;
          const labels = ticks.map(time => {
            const formatted = formatTime(time);
            const label = positionedNode('text', {
              'font-size': 12, class: 'chart-label', 'data-time-label': '', 'data-time-value': time,
              'text-anchor': 'middle', 'aria-label': formatted,
            }, () => ({ x: timeX(time), y: charts.at(-1).height - 28 }), formatted);
            label.replaceChildren(
              positionedNode('tspan', { dy: 0 }, () => ({ x: timeX(time) }), formatted.slice(0, 5) + ' '),
              positionedNode('tspan', { dy: 14 }, () => ({ x: timeX(time) }), formatted.slice(6)),
            );
            svg.append(label);
            return label;
          });
          timeLabels.push(labels);
        });
        $('chart-panel').hidden = false;
        const viewport = charts[0].viewport;
        const syncScroll = source => {
          for (const chart of charts) {
            if (chart.viewport.scrollLeft !== source.scrollLeft) chart.viewport.scrollLeft = source.scrollLeft;
          }
        };
        charts.forEach(chart => chart.viewport.addEventListener('scroll', () => syncScroll(chart.viewport), { passive: true }));
        const resizeChart = () => {
          // On phones, reserve only the space actually occupied by axis labels.
          const gutters = { left: axisWidth, right: axisWidth };
          if (window.innerWidth <= 560) {
            for (const side of ['left', 'right']) {
              gutters[side] = Math.max(16, ...charts.map(chart => {
                const bounds = $(`chart-${side}-axes${chart.suffix}`).getBBox();
                if (!bounds.width) return 16;
                return Math.ceil(side === 'left' ? axisWidth - bounds.x + 2 : bounds.x + bounds.width + 2);
              }));
            }
          }
          for (const chart of charts) {
            for (const side of ['left', 'right']) {
              const axis = $(`chart-${side}-axes${chart.suffix}`);
              axis.setAttribute('style', `--axis-width: ${gutters[side]}px`);
              axis.setAttribute('viewBox', `${side === 'left' ? axisWidth - gutters[side] : 0} 0 ${gutters[side]} ${chart.height}`);
            }
          }
          // Open with the entire history fitted exactly to the visible width.
          const width = viewport.clientWidth;
          if (!width) return;
          W = zoom === minZoom ? width : (width - 2 * timePadding) * intervals / 2 * zoom + 2 * timePadding;
          charts.forEach(chart => chart.svg.setAttribute('style', `width: ${W}px`));
          const screenHeight = window.visualViewport?.height || window.innerHeight;
          const scrollbarsHeight = charts.reduce((sum, chart) => sum + chart.viewport.offsetHeight - chart.viewport.clientHeight, 0);
          const panel = $('chart-panel');
          const panelTop = panel.getBoundingClientRect().top + window.scrollY;
          const bottomSpace = parseFloat(getComputedStyle(document.body).paddingBottom) + parseFloat(getComputedStyle(panel).marginBottom);
          // Fit below the header, including page spacing and the charts' own scrollbars.
          const available = screenHeight - panelTop - bottomSpace - scrollbarsHeight;
          const plotHeight = Math.max(1, Math.floor((available - 46) / charts.length) - plotTop - 6);
          plotBottom = plotTop + plotHeight;
          charts.forEach((chart, index) => {
            chart.height = plotBottom + (index === charts.length - 1 ? 52 : 6);
            chart.svg.setAttribute('height', chart.height);
            chart.svg.setAttribute('viewBox', `0 0 ${W} ${chart.height}`);
            for (const side of ['left', 'right']) {
              const axis = $(`chart-${side}-axes${chart.suffix}`);
              axis.setAttribute('height', chart.height);
              axis.setAttribute('viewBox', `${side === 'left' ? axisWidth - gutters[side] : 0} 0 ${gutters[side]} ${chart.height}`);
            }
          });
          geometryUpdates.forEach(update => update());
          const labelStride = Math.ceil(1 / zoom);
          timeLabels.forEach(labels => labels.forEach((label, index) => label.setAttribute('visibility', index % labelStride === 0 ? 'visible' : 'hidden')));
          syncScroll(viewport);
          $('chart-zoom-in').disabled = zoom >= maxZoom;
          $('chart-zoom-out').disabled = zoom <= minZoom;
        };
        const changeZoom = (factor, anchorX = viewport.clientWidth / 2, nextAnchorX = anchorX) => {
          const width = viewport.clientWidth;
          const anchorTime = ((viewport.scrollLeft || 0) + anchorX - timePadding) / (W - 2 * timePadding);
          zoom = Math.max(minZoom, Math.min(maxZoom, zoom * factor));
          resizeChart();
          viewport.scrollLeft = Math.max(0, Math.min(W - width, timePadding + anchorTime * (W - 2 * timePadding) - nextAnchorX));
          syncScroll(viewport);
        };
        $('chart-zoom-in').addEventListener('click', () => changeZoom(2));
        $('chart-zoom-out').addEventListener('click', () => changeZoom(.5));
        charts.forEach(({ viewport: target }) => {
          // Trackpad pinch gestures arrive as Ctrl+wheel events in desktop browsers.
          target.addEventListener('wheel', event => {
            if (!event.ctrlKey) return;
            event.preventDefault();
            const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? target.clientWidth : 1;
            changeZoom(Math.exp(-event.deltaY * unit * .01), event.clientX - target.getBoundingClientRect().left);
          }, { passive: false });
          let pinch = null;
          const gesture = event => {
            const [a, b] = event.touches;
            return {
              distance: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
              center: (a.clientX + b.clientX) / 2 - target.getBoundingClientRect().left,
            };
          };
          target.addEventListener('touchstart', event => {
            pinch = null;
            if (event.touches.length !== 2) return;
            event.preventDefault();
            pinch = gesture(event);
          }, { passive: false });
          target.addEventListener('touchmove', event => {
            if (event.touches.length !== 2) { pinch = null; return; }
            event.preventDefault();
            const next = gesture(event);
            if (pinch && pinch.distance > 0 && next.distance > 0) {
              changeZoom(next.distance / pinch.distance, pinch.center, next.center);
            }
            pinch = next;
          }, { passive: false });
          const endPinch = () => { pinch = null; };
          target.addEventListener('touchend', endPinch);
          target.addEventListener('touchcancel', endPinch);
        });
        resizeChart();
        const observer = new ResizeObserver(resizeChart);
        observer.observe(viewport);
        window.addEventListener('resize', resizeChart);
        window.visualViewport?.addEventListener('resize', resizeChart);
        return resizeChart;
      }

      function renderReading(data, showHeading, time) {
        const card = $('reading-template').content.firstElementChild.cloneNode(true);
        const field = name => card.querySelector(`[data-field="${name}"]`);
        card.dataset.packetIndex = String(data.packetIndex);
        card.setAttribute('aria-label', `Measurement #${data.measurement} at ${time}`);
        field('record-heading').hidden = !showHeading;
        field('measurement').textContent = String(data.measurement);
        field('timestamp').textContent = time;
        field('humidity').textContent = `${data.humidity.toFixed(1)} %RH`;
        field('co2-card').hidden = data.co2 === null;
        field('lux-reading').hidden = data.lux === null;
        field('lux').textContent = data.lux === null ? '—' : `${data.lux} lux`;
        field('tilt-card').hidden = data.x === null;
        const angle = tiltAngle(data);
        field('tilt').textContent = angle === null ? '—' : `${Number(angle.toFixed(1))}°`;
        field('pressure-reading').hidden = data.pressure === null;
        field('temp').textContent = `${data.temp} °C`;
        field('pressure').textContent = data.pressure === null ? '—' : `${data.pressure / 100} hPa`;
        field('co2').textContent = data.co2 === null ? '—' : `${data.co2.toFixed(2)} % CO₂`;
        const o2Flags = [
          [0x01, 'Measurement complete'],
          [0x02, 'Measurement in progress'],
          [0x04, 'SHT4x error'],
          [0x10, 'SHT4x measurement complete'],
          [0x20, 'Default script restored'],
        ];
        if (data.o2Status === 0) {
          field('o2').textContent = `${data.o2.toFixed(2)} % O₂`;
        } else {
          field('o2').textContent = 'O2 Measurement failed';
          field('o2-card').classList.add('error');
          const flags = o2Flags.filter(([bit]) => data.o2Status & bit).map(([, label]) => label);
          field('o2-details').textContent = `(${hex(data.o2Status)}${flags.length ? ': ' + flags.join('; ') : ''})`;
          field('o2-details').hidden = false;
        }
        return card;
      }

      try {
        const fragment = location.hash.slice(1);
        if (!fragment) {
          $('status').textContent = 'No sensor data. Open a link from an NFC tag to view readings.';
          $('status').hidden = false;
          return;
        }
        const data = parse(decodeBase64(fragment));
        $('sensor-id').textContent = String(data.deviceId).padStart(4, '0');
        $('sensor-heading').title = `Sensor: ${$('sensor-id').textContent}`;
        const records = [...data.records].sort((a, b) => a.timestamp - b.timestamp);
        const last = records.at(-1);
        const now = Date.now();
        const timeOffset = last ? now - last.timestamp * 1000 : 0;
        $('history-values').replaceChildren(...records.map(record => renderReading(record, true, formatTime(timeOffset + record.timestamp * 1000))));
        $('history').hidden = records.length === 0;
        $('history-summary').textContent = `${records.length} readings`;
        if (last) {
          $('values').replaceChildren(renderReading(last, false, formatTime(now)));
          $('measurement').textContent = String(last.measurement);
          $('timestamp').textContent = formatTime(now);
          $('measurement-info').hidden = false;
          $('values').hidden = false;
          resizeCharts = drawChart(records, timeOffset);
        } else {
          $('status').textContent = 'No measurements available.';
          $('status').hidden = false;
        }
      } catch (error) {
        $('status').classList.add('error');
        $('status').hidden = false;
        $('status').textContent = `Could not read data: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
